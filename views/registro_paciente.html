<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear mi cuenta - MedHealth</title>
    <link rel="stylesheet" href="../assets/css/medhealth.css">
</head>
<body>
    <div class="public-shell">
        <header class="public-topbar">
            <a href="../index.html" class="brand-link">
                <span class="brand-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
                </span>
                <span>MedHealth</span>
            </a>
            <nav class="topbar-actions" aria-label="Accesos públicos">
                <a href="terminos.html" class="topbar-link">Términos y privacidad</a>
                <a href="login.html" class="topbar-link">Iniciar sesión</a>
            </nav>
        </header>

        <main class="public-main">
            <section class="tarjeta tarjeta-form tarjeta-900">
                <div style="margin-bottom: 28px; padding-bottom: 18px; border-bottom: 3px solid var(--tinta);">
                    <h1>Crear mi cuenta</h1>
                    <p class="cuerpo text-muted" style="margin-top: 8px;">Completa tus datos personales para abrir tu horario diario. Tus datos se guardan solo para tu seguimiento personal.</p>
                </div>

                <div id="registro-alert" class="aviso aviso-error" role="alert" aria-live="polite" style="margin-bottom: 24px;" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
                    <span id="registro-alert-text"></span>
                </div>

                <form action="../controllers/registrar_paciente.php" method="POST" class="form-stack">
                    <div class="form-grid-2">
                        <div class="campo">
                            <label for="nombres">Nombre(s)</label>
                            <input type="text" id="nombres" name="nombres" placeholder="Ej. María Elena" required>
                        </div>

                        <div class="campo">
                            <label for="paterno">Apellido paterno</label>
                            <input type="text" id="paterno" name="paterno" placeholder="Ej. Hernández" required>
                        </div>

                        <div class="campo">
                            <label for="materno">Apellido materno</label>
                            <input type="text" id="materno" name="materno" placeholder="Ej. Morales">
                        </div>

                        <div class="campo">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 55 1234 5678">
                        </div>

                        <div class="campo" id="campo-email">
                            <label for="email">Correo electrónico</label>
                            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                            <span id="email-error" class="mensaje-error" aria-live="polite"></span>
                        </div>

                        <div class="campo">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                        </div>
                    </div>

                    <label class="checkbox-campo" for="acepto_terminos">
                        <input type="checkbox" id="acepto_terminos" name="acepto_terminos" required>
                        <span>
                            Acepto los <a href="terminos.html">términos y el aviso de privacidad</a> de MedHealth.
                        </span>
                    </label>

                    <button type="submit" class="btn btn-primario btn-block">Crear mi cuenta y continuar</button>

                    <div style="text-align: center; margin-top: 8px;">
                        <a href="login.html" class="cuerpo-bold">Ya tengo cuenta, iniciar sesión</a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var error = params.get('error');
        if (!error) return;

        var alertBox = document.getElementById('registro-alert');
        var alertText = document.getElementById('registro-alert-text');
        var emailInput = document.getElementById('email');
        var emailError = document.getElementById('email-error');
        var campoEmail = document.getElementById('campo-email');

        if (error === 'correo_duplicado') {
            var msg = 'Este correo ya está registrado. Intenta iniciar sesión o usa otro correo.';
            alertText.textContent = msg;
            alertBox.hidden = false;
            emailError.textContent = msg;
            campoEmail.classList.add('campo-error');
            emailInput.setAttribute('aria-invalid', 'true');
        } else {
            alertText.textContent = 'No se pudo completar el registro. Verifica tus datos e inténtalo de nuevo.';
            alertBox.hidden = false;
        }
    })();
    </script>
</body>
</html>
