<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Paciente - Cuidate+</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/registro_paciente.css">
</head>
<body>

    <main class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h2>Registro del Paciente</h2>
                <p class="subtitle">* Datos del usuario principal</p>
            </div>

            <form action="../controllers/registrar_paciente.php" method="POST">
                <div class="form-group">
                    <label for="nombres">Nombre(s)</label>
                    <input type="text" id="nombres" name="nombres" placeholder="Ingresa tus nombres" required>
                </div>

                <div class="row-group">
                    <div class="form-group">
                        <label for="paterno">Apellido Paterno</label>
                        <input type="text" id="paterno" name="paterno" placeholder="Apellido paterno" required>
                    </div>
                    <div class="form-group">
                        <label for="materno">Apellido Materno</label>
                        <input type="text" id="materno" name="materno" placeholder="Apellido materno" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>
                </div>

                <div class="links-row">
                    <a href="login.html" class="link-nav">&larr; Iniciar Sesión</a>
                    <a href="terminos.html" class="link-nav">Aviso de privacidad &rarr;</a>
                </div>

                <button type="submit" class="btn-register">Registrarse</button>
            </form>
        </div>
    </main>

</body>
</html>
