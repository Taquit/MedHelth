<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Cuidate+</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            <h2 class="login-title">Iniciar Sesión</h2>

            <form action="../controllers/login.php" method="POST">
                <div class="form-group">
                    <label for="email">Correo:</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="ingresa contraseña" required>
                </div>

                <div class="links-row">
                    <a href="registro_paciente.html" class="link-nav">&larr; Registrarse</a>
                    <a href="olvide_contrasena.html" class="link-nav">Olvide mi contraseña &rarr;</a>
                </div>

                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>
        </div>
    </main>

</body>
</html>
