<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - MedHealth</title>
    <link rel="stylesheet" href="../assets/css/medhealth.css">
</head>
<body>
    <div class="public-shell">
        <header class="public-topbar">
            <a href="../index.html" class="brand-link">
                <span class="brand-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
                </span>
                <span>MedHealth</span>
            </a>
            <nav class="topbar-actions" aria-label="Accesos públicos">
                <a href="terminos.html" class="topbar-link">Términos y privacidad</a>
                <a href="registro_paciente.html" class="topbar-link">Crear mi cuenta</a>
            </nav>
        </header>

        <main class="public-main">
            <section class="tarjeta tarjeta-form tarjeta-560">
                <div style="margin-bottom: 24px; padding-bottom: 18px; border-bottom: 3px solid var(--tinta);">
                    <h1>Iniciar sesión</h1>
                    <p class="cuerpo text-muted" style="margin-top: 6px;">Ingresa con tu correo y contraseña para ver tus medicamentos de hoy.</p>
                </div>

                <div id="login-aviso-error" class="aviso aviso-error" role="alert" aria-live="polite" style="margin-bottom: 20px;" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
                    <span id="login-aviso-error-text"></span>
                </div>

                <div id="login-aviso-ok" class="aviso aviso-exito" role="status" aria-live="polite" style="margin-bottom: 20px;" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                    <span id="login-aviso-ok-text"></span>
                </div>

                <form action="../controllers/login.php" method="POST" class="form-stack">
                    <div class="campo" id="campo-email">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                        <span id="email-error" class="mensaje-error" aria-live="polite"></span>
                    </div>

                    <div class="campo" id="campo-password">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                        <span id="password-error" class="mensaje-error" aria-live="polite"></span>
                    </div>

                    <div>
                        <a href="olvide_contrasena.html" class="cuerpo-bold">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-primario btn-block">Entrar a mi horario</button>
                </form>

                <div style="margin-top: 28px; padding-top: 24px; border-top: 2px solid var(--regla); text-align: center; display: flex; flex-direction: column; gap: 14px;">
                    <p class="cuerpo text-muted">¿Aún no tienes cuenta en MedHealth?</p>
                    <a href="registro_paciente.html" class="btn btn-secundario btn-block">Crear mi cuenta</a>
                </div>
            </section>
        </main>
    </div>

    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var error = params.get('error');
        var rec = params.get('recuperacion');

        if (rec === 'enviada') {
            var okBox = document.getElementById('login-aviso-ok');
            var okText = document.getElementById('login-aviso-ok-text');
            okText.textContent = 'Si tu correo está registrado, se registró tu solicitud de recuperación.';
            okBox.hidden = false;
        }

        if (!error) return;
        var errBox = document.getElementById('login-aviso-error');
        var errText = document.getElementById('login-aviso-error-text');

        if (error === 'no_registrado') {
            var msgEmail = 'Este correo no está registrado en MedHealth.';
            errText.textContent = msgEmail;
            errBox.hidden = false;
            document.getElementById('email-error').textContent = msgEmail;
            document.getElementById('campo-email').classList.add('campo-error');
            document.getElementById('email').setAttribute('aria-invalid', 'true');
        } else if (error === 'credenciales') {
            var msgPass = 'La contraseña ingresada es incorrecta. Inténtalo de nuevo.';
            errText.textContent = msgPass;
            errBox.hidden = false;
            document.getElementById('password-error').textContent = msgPass;
            document.getElementById('campo-password').classList.add('campo-error');
            document.getElementById('password').setAttribute('aria-invalid', 'true');
        }
    })();
    </script>
</body>
</html>
