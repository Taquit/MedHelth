<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../assets/css/medhealth.css">
</head>
<body>
    <div class="public-shell">
        <header class="public-topbar">
            <a href="dashboard.php" class="brand-link">
                <span class="brand-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
                </span>
                <span>MedHealth</span>
            </a>
            <a href="dashboard.php" class="topbar-link">Ir a mi panel</a>
        </header>

        <main class="public-main">
            <section class="tarjeta tarjeta-form tarjeta-560" style="text-align: center;" aria-live="polite">
                <div class="icon-halo-exito">
                    <span class="icon-circle-116">
                        <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                </div>

                <h1 id="titulo-toma">¡Muy bien!</h1>
                <p id="detalle-toma" class="cuerpo-grande text-muted" style="margin-top: 12px; margin-bottom: 32px;">
                    Registraste tu medicamento correctamente.
                </p>

                <a href="dashboard.php" class="btn btn-primario btn-block">Volver a mi panel</a>
            </section>
        </main>
    </div>

    <script>
    (function () {
        var params = new URLSearchParams(window.location.search);
        var nombre = (params.get('nombre') || '').trim();
        var medicamento = (params.get('medicamento') || '').trim();
        var hora = (params.get('hora') || '').trim();

        var titulo = document.getElementById('titulo-toma');
        var detalle = document.getElementById('detalle-toma');

        if (nombre !== '') {
            titulo.textContent = '¡Muy bien, ' + nombre + '!';
        }

        if (medicamento !== '' && hora !== '') {
            detalle.textContent = 'Registraste ' + medicamento + ' a las ' + hora + '.';
        } else if (medicamento !== '') {
            detalle.textContent = 'Registraste ' + medicamento + ' correctamente.';
        }
    })();
    </script>
</body>
</html>
